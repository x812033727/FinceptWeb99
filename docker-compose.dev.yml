# Dev overrides: hot reload, exposed ports, volume mounts
services:
  backend:
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    environment:
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"

  frontend:
    build:
      context: ./frontend
      target: dev
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "5173:5173"

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
