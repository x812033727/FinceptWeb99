apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fincept-web.fullname" . }}-frontend
  labels:
    {{- include "fincept-web.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.replicaCount.frontend }}
  selector:
    matchLabels:
      {{- include "fincept-web.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "fincept-web.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: frontend
          image: "{{ .Values.image.frontend.repository }}:{{ required "image.frontend.tag is required — pin a specific version (no 'latest') for reliable rollback" .Values.image.frontend.tag }}"
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe.frontend | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe.frontend | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.frontend | nindent 12 }}
