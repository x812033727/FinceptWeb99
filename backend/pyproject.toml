[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket --allow-hosts=localhost,127.0.0.1,::1"
filterwarnings = [
    # Every warning not explicitly classified below is a regression. Pytest
    # gives the last matching filter precedence.
    "error",
    # passlib still imports stdlib crypt, deprecated since 3.11 and still
    # present in 3.12. It is REMOVED in 3.13, so this stops being a warning
    # and starts being an ImportError — the password-hashing backend has to
    # migrate before the next runtime bump, not merely eventually. (Same
    # passlib that pins bcrypt to the 3.2 line; see .github/dependabot.yml.)
    "ignore:'crypt' is deprecated.*:DeprecationWarning",
    # Read-only bind mounts used by local verification cannot persist pytest's
    # cache. CI checkouts are writable, so this is environment-only noise.
    "ignore:cache could not write path.*:_pytest.warning_types.PytestCacheWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "finmind/tests/*",
    "db/migrations/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
