apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fincept-web.fullname" . }}-backend-env
  labels:
    {{- include "fincept-web.labels" . | nindent 4 }}
data:
  # Computed URLs that interpolate other values blocks stay templated.
  DATABASE_URL: "postgresql+asyncpg://{{ .Values.postgresql.user }}:$(POSTGRES_PASSWORD)@{{ .Values.postgresql.host }}:{{ .Values.postgresql.port }}/{{ .Values.postgresql.database }}"
  REDIS_URL: "redis://:$(REDIS_PASSWORD)@{{ .Values.redis.host }}:{{ .Values.redis.port }}/0"
  # Everything else flows through verbatim from values.yaml — adding a new
  # backend env var only requires editing values.yaml, never this template.
  {{- range $key, $value := .Values.env.backend }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
