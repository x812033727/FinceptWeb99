name: Browser E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  professional-beta:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fincept
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d fincept"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:test@127.0.0.1:5432/fincept
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: e2e-test-secret-key-with-at-least-32-characters
      ADMIN_EMAIL: admin-e2e@example.com
      ADMIN_PASSWORD: AdminPass99!
      E2E_ADMIN_EMAIL: admin-e2e@example.com
      E2E_ADMIN_PASSWORD: AdminPass99!
      SCHEDULER_ENABLED: "false"
      FINMIND_AUTO_INIT: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Migrate database
        working-directory: backend
        run: alembic -c alembic.ini upgrade head
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start application
        run: |
          nohup uvicorn main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          nohup npm --prefix frontend run dev -- --host 127.0.0.1 > /tmp/frontend.log 2>&1 &
          for i in {1..90}; do
            curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null && curl --fail --silent http://127.0.0.1:5173 >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/backend.log
          cat /tmp/frontend.log
          exit 1
      - name: Run browser flows
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/output/playwright-*
          if-no-files-found: ignore
