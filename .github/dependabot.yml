version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    ignore:
      # The scientific stack has moved to Python >= 3.12 while the backend
      # image is still python:3.11-slim-bookworm. pip cannot resolve these
      # at all, so one of them fails `pip install` and takes the whole
      # grouped PR — every other bump included — down with it.
      #
      # Both entries come off together when the runtime moves to 3.12; CI
      # already runs a passing 3.12 compatibility job. Expect this list to
      # grow until then, which is the argument for doing the upgrade.
      - dependency-name: numpy
        versions: [">=2.5"]
      - dependency-name: scipy
        versions: [">=1.18"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ["*"]
    ignore:
      # typescript-eslint 8.x pins peer typescript ">=4.8.4 <6.1.0", so a
      # TS 7 bump makes `npm ci` fail ERESOLVE and takes the whole grouped
      # PR down with it. Drop this once typescript-eslint supports TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
