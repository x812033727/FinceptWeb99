{{- if not .Values.postgresql.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fincept-web.fullname" . }}-secrets
  labels:
    {{- include "fincept-web.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "postgresql.password is required" .Values.postgresql.password | quote }}
  REDIS_PASSWORD: {{ required "redis.password is required" .Values.redis.password | quote }}
  JWT_SECRET_KEY: {{ required "env.backend.JWT_SECRET_KEY is required" .Values.env.backend.JWT_SECRET_KEY | quote }}
  POLYGON_API_KEY: {{ .Values.env.backend.POLYGON_API_KEY | quote }}
  FRED_API_KEY: {{ .Values.env.backend.FRED_API_KEY | quote }}
  FINMIND_TOKEN: {{ .Values.env.backend.FINMIND_TOKEN | quote }}
  OPENAI_API_KEY: {{ .Values.env.backend.OPENAI_API_KEY | quote }}
  ANTHROPIC_API_KEY: {{ .Values.env.backend.ANTHROPIC_API_KEY | quote }}
  GEMINI_API_KEY: {{ .Values.env.backend.GEMINI_API_KEY | quote }}
{{- end }}
