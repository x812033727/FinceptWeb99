[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
# The only pytest config. A `pytest.ini` used to sit alongside this and
# won outright — pytest takes the highest-precedence file and ignores the
# rest wholesale, announcing it on every run:
#     configfile: pytest.ini (WARNING: ignoring pytest config in pyproject.toml!)
# Everything below was therefore inert, including two policies that read
# as active: the socket ban and warnings-as-errors. Keep this the single
# source; a second config file silently disables all of it again.
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# No test needs the network — the whole suite passes with sockets banned,
# and ~20% faster for it. Without the ban, tests reach real upstreams
# (FinMind especially), the calls get swallowed by the code's own
# try/except, and the suite goes green either way — until an upstream
# hiccup makes it flake.
addopts = "--disable-socket --allow-unix-socket --allow-hosts=localhost,127.0.0.1,::1"
filterwarnings = [
    # Every warning not explicitly classified below is a regression. Pytest
    # gives the last matching filter precedence.
    "error",
    # passlib still imports stdlib crypt, deprecated since 3.11 and still
    # present in 3.12. It is REMOVED in 3.13, so this stops being a warning
    # and starts being an ImportError — the password-hashing backend has to
    # migrate before the next runtime bump, not merely eventually. (Same
    # passlib that pins bcrypt to the 3.2 line; see .github/dependabot.yml.)
    "ignore:'crypt' is deprecated.*:DeprecationWarning",
    # Read-only bind mounts used by local verification cannot persist pytest's
    # cache. CI checkouts are writable, so this is environment-only noise.
    "ignore:cache could not write path.*:_pytest.warning_types.PytestCacheWarning",
    # Python 3.12 deprecated sqlite3's default date/datetime adapter, but only
    # WARNS the first time a process binds one — CPython's warnings registry
    # dedups every subsequent occurrence. Run the whole finmind/tests/ suite
    # and some earlier test eats the one warning, so this never surfaces; run
    # any single file whose first DB write binds a `date` (e.g.
    # test_ingest.py, test_runner_fallback.py) in isolation and THAT file's
    # first date-binding test explodes on it instead — order-dependent
    # flakiness, not a real regression to chase per-file. finmind's own
    # in-memory-SQLite test suite is the only place this can fire (Postgres
    # in prod doesn't have this adapter), so ignoring it here is safe.
    "ignore:The default date adapter is deprecated.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "finmind/tests/*",
    "db/migrations/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
