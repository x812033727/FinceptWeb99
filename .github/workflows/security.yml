name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Audit Python dependencies
        working-directory: backend
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit frontend dependencies
        working-directory: frontend
        # Allowlist GHSA-qwww-vcr4-c8h2 (react-router "RSC Mode CSRF Bypass").
        # This app is a client-side Vite SPA using <BrowserRouter> — it does
        # not use React Router's RSC / framework mode, so the advisory's
        # attack surface does not exist here. No forward-patched
        # react-router-dom has shipped yet (7.18.1 is latest); npm's only
        # suggested fix is a breaking downgrade to 7.11.0. Drop this
        # allowlist once a patched >=7.18.x / 8.x is available. Any other
        # high/critical advisory still fails the job.
        run: |
          set -euo pipefail
          ALLOW="GHSA-qwww-vcr4-c8h2"
          audit=$(npm audit --audit-level=high --json || true)
          offenders=$(echo "$audit" | jq -r --arg allow "$ALLOW" '
            [ .vulnerabilities[]?
              | select(.severity=="high" or .severity=="critical")
              | .via[]? | objects
              | select(((.url // "") | contains($allow)) or ((.source|tostring) == $allow) | not)
              | "\(.name // "?"): \(.title // .url // "?")"
            ] | unique | .[]' )
          if [ -n "$offenders" ]; then
            echo "Un-allowlisted high/critical advisories found:"
            echo "$offenders"
            exit 1
          fi
          echo "Only the allowlisted advisory ($ALLOW) is present — OK."

  repository-scan:
    name: Trivy repository scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
