maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec

# Security — REDIS_PASSWORD passed via --requirepass CLI flag in compose command.
# (redis.conf does not expand shell variables, so we set it via CLI instead.)

# Disable dangerous commands in production
rename-command FLUSHALL ""
rename-command FLUSHDB  ""
rename-command DEBUG    ""
rename-command CONFIG   "CONFIG_ADMIN_ONLY"
