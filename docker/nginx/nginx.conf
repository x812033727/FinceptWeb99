# ── rate limiting zones ──────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

upstream backend {
    server backend:8000;
    keepalive 16;
}

upstream frontend {
    server frontend:80;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # ── response compression ─────────────────────────────────────
    # Large JSON payloads (screener, history, discussion contexts)
    # shrink 5-10×. SSE is unaffected (text/event-stream is not in
    # gzip_types); WebSocket upgrades bypass gzip entirely.
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        application/json application/javascript text/css text/plain image/svg+xml;

    # ── security headers ─────────────────────────────────────────
    add_header X-Content-Type-Options   "nosniff"           always;
    add_header X-Frame-Options          "DENY"              always;
    add_header X-XSS-Protection         "1; mode=block"     always;
    add_header Referrer-Policy          "strict-origin"     always;

    # ── WebSocket ────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;
    }

    # ── auth endpoints — tighter rate limit ──────────────────────
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection      "";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API ──────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection      "";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx defaults proxy_read/send_timeout to 60s, which is too tight
        # for this app's heavy synchronous endpoints (discussion/sweep
        # aggregates, reports) and for SSE gaps during ctx-gathering / a slow
        # subscription persona call — those return 504 at 60s. 5 min covers
        # them; genuinely-streamed responses reset the read timer per chunk.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # ── Swagger / OpenAPI ────────────────────────────────────────
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # ── Frontend (React SPA) ─────────────────────────────────────
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_intercept_errors on;
        error_page 404 = @spa_fallback;
    }

    location @spa_fallback {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
    }
}
