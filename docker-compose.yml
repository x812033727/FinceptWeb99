services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    # pg_stat_statements alongside timescaledb (the image's default only
    # preloads timescaledb) — powers the P4 index-audit workflow: rank
    # queries by mean_exec_time × calls, then EXPLAIN the top offenders.
    # Existing volumes need a one-time `CREATE EXTENSION pg_stat_statements;`
    # (init.sql only runs on a fresh data dir).
    command: postgres -c shared_preload_libraries=timescaledb,pg_stat_statements
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-finceptweb}
      POSTGRES_USER:     ${POSTGRES_USER:-fincept}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fincept} -d ${POSTGRES_DB:-finceptweb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Isolated Postgres for the FinMind clone subsystem (backend/finmind/).
  # Lives on a separate port + volume so the main app's `postgres` service
  # is unaffected — bring this up only while developing/validating the
  # FinMind clone:
  #   docker compose up -d postgres_finmind
  #   cd backend && python -m finmind.scripts.init_db
  postgres_finmind:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB:       ${FINMIND_POSTGRES_DB:-finmind_clone}
      POSTGRES_USER:     ${FINMIND_POSTGRES_USER:-finmind}
      POSTGRES_PASSWORD: ${FINMIND_POSTGRES_PASSWORD:-finmind_dev_password}
    volumes:
      - finmind_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FINMIND_POSTGRES_USER:-finmind} -d ${FINMIND_POSTGRES_DB:-finmind_clone}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles: ["finmind"]

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server /etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ./docker/redis/redis.conf:/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    # Runs BOTH alembic ledgers before the backend starts:
    #   `public.alembic_version`            (main app, `alembic upgrade head`)
    #   `finmind.alembic_version_finmind`   (`python -m finmind.scripts.init_db`,
    #                                        idempotent: upgrade + catalog UPSERT)
    # Running the FinMind ledger here (instead of only in the backend's
    # lifespan auto-init) gives multi-pod deploys a race-free pre-deploy
    # step for free: set FINMIND_AUTO_INIT=false on the backend pods and
    # this service is the single writer. Single-pod compose keeps the
    # lifespan auto-init as a harmless no-op double-check.
    build: ./backend
    command: sh -c "alembic upgrade head && python -m finmind.scripts.init_db"
    environment:
      DATABASE_URL:   postgresql+asyncpg://${POSTGRES_USER:-fincept}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finceptweb}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM:  ${JWT_ALGORITHM:-HS256}
      # FinMind clone ledger — same passthrough pattern as the backend
      # service; without these the init_db step can't resolve its DB.
      FINMIND_USE_MAIN_DB:  ${FINMIND_USE_MAIN_DB:-true}
      FINMIND_DATABASE_URL: ${FINMIND_DATABASE_URL:-postgresql+asyncpg://finmind:finmind_dev_password@postgres_finmind:5432/finmind_clone}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  backend:
    build: ./backend
    # 3 workers now that the scheduler is a separate container (P2) —
    # there is no longer a per-worker scheduler penalty.
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 3
    # Reach the host-side LLM Gateway sidecar (subscription providers)
    # via the host-gateway alias; no-op unless LLM_GATEWAY_URL is set.
    extra_hosts:
      - "host-gateway:host-gateway"
    environment: &app-env
      DATABASE_URL:      postgresql+asyncpg://${POSTGRES_USER:-fincept}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finceptweb}
      REDIS_URL:         redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
      POLYGON_API_KEY:   ${POLYGON_API_KEY:-}
      FINMIND_TOKEN:     ${FINMIND_TOKEN:-}
      FRED_API_KEY:      ${FRED_API_KEY:-}
      OPENAI_API_KEY:    ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY:    ${GEMINI_API_KEY:-}
      OLLAMA_HOST:       ${OLLAMA_HOST:-http://ollama:11434}
      # LLM Gateway (subscription providers) — host sidecar reached via
      # the host-gateway alias (see extra_hosts). Empty URL disables the
      # claude_sub / codex_sub / agy providers. See /opt/llm-gateway.
      LLM_GATEWAY_URL:   ${LLM_GATEWAY_URL:-}
      LLM_GATEWAY_TOKEN: ${LLM_GATEWAY_TOKEN:-}
      AI_FALLBACK_TO_API: ${AI_FALLBACK_TO_API:-true}
      AI_AUTO_UPGRADE_TO_SUB: ${AI_AUTO_UPGRADE_TO_SUB:-true}
      AI_DEFAULT_STACK:  ${AI_DEFAULT_STACK:-api}
      JWT_SECRET_KEY:    ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM:     ${JWT_ALGORITHM:-HS256}
      CORS_ORIGINS:      ${CORS_ORIGINS:-http://localhost}
      ADMIN_EMAIL:       ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD:    ${ADMIN_PASSWORD:-}
      # /metrics gate — without this passthrough the in-compose
      # Prometheus scrapes from the docker bridge and gets 403 against
      # the default 127.0.0.1-only allowlist. Same enumerated-keys
      # rule as the FinMind vars below.
      METRICS_ALLOW_CIDRS: ${METRICS_ALLOW_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12}
      METRICS_AUTH_TOKEN:  ${METRICS_AUTH_TOKEN:-}
      # FinMind clone subsystem — see backend/finmind/config.py.
      # Without explicit passthrough here, .env edits never reach
      # the container's process env (compose only enumerates listed
      # keys; there's no env_file: .env directive on this service).
      # Default `USE_MAIN_DB=true` shares the main Postgres via a
      # `finmind` schema — works without spinning up the separate
      # `postgres_finmind` container. Set to `false` if running
      # `docker compose --profile finmind up` for the sidecar DB.
      FINMIND_USE_MAIN_DB:    ${FINMIND_USE_MAIN_DB:-true}
      FINMIND_AUTO_INIT:      ${FINMIND_AUTO_INIT:-true}
      FINMIND_DATABASE_URL:   ${FINMIND_DATABASE_URL:-postgresql+asyncpg://finmind:finmind_dev_password@postgres_finmind:5432/finmind_clone}
      # SMTP — daily auto-run discussion email report. Leave HOST/FROM
      # empty to disable (the cron skips silently). Same passthrough
      # pattern as the FinMind vars above so .env edits actually reach
      # the container.
      SMTP_HOST:              ${SMTP_HOST:-}
      SMTP_PORT:              ${SMTP_PORT:-587}
      SMTP_USER:              ${SMTP_USER:-}
      SMTP_PASSWORD:          ${SMTP_PASSWORD:-}
      SMTP_FROM:              ${SMTP_FROM:-}
      SMTP_USE_TLS:           ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL:           ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SECONDS:   ${SMTP_TIMEOUT_SECONDS:-20}
      # Web Push / VAPID (PR-D3 瀏覽器推播). Leave keys empty to
      # disable the web_push transport (fail-closed, same shape as
      # SMTP above). Same enumerated-keys passthrough rule.
      VAPID_PUBLIC_KEY:       ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY:      ${VAPID_PRIVATE_KEY:-}
      VAPID_CLAIMS_EMAIL:     ${VAPID_CLAIMS_EMAIL:-}
      # Shared lesson pools — JSON list-of-groups of user-id UUIDs that
      # share one lesson library (read union + cross-account dedup).
      # Same .env passthrough pattern as the vars above (no env_file on
      # this service). Empty = legacy single-owner behavior.
      LESSON_SHARED_OWNER_GROUPS: ${LESSON_SHARED_OWNER_GROUPS:-}
      # Web workers do NOT host APScheduler/Kraken pump — the dedicated
      # `scheduler` service below does. Leaving this on would run every
      # job once per uvicorn worker (upstream quota burns N×).
      SCHEDULER_ENABLED: "false"
      # Per-process SQLAlchemy pool budget: 3 web workers × (10+10)
      # + scheduler (5+5) = 70 ≤ PG default max_connections 100 − reserve.
      DB_POOL_SIZE:     ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW:  ${DB_MAX_OVERFLOW:-10}
    volumes:
      # Bidirectional channel for the admin one-click redeploy button.
      # Backend touches /host-trigger/deploy-trigger to fire the host's
      # finceptweb-deploy.path systemd unit; backend reads the status
      # JSON the deploy script writes alongside it. Mount path is
      # /opt/finceptweb/var on the host (must exist with uid 1001).
      - ./var:/host-trigger
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Dedicated scheduler process (blueprint P2): hosts APScheduler +
  # KrakenTickerPump exactly once per deployment. Same image and env
  # as the backend (YAML merge of &app-env), different entrypoint.
  # Quote pollers read the cross-worker subscription registry in Redis,
  # so this process covers every web worker's WebSocket clients.
  scheduler:
    build: ./backend
    command: python worker.py
    extra_hosts:
      - "host-gateway:host-gateway"
    environment:
      <<: *app-env
      SCHEDULER_ENABLED: "true"
      # Scheduler runs batch jobs, not request traffic — small pool.
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: production
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.50.0
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      # Parameterized so a host running several deployments can move each
      # stack's Prometheus off the default (same pattern as GRAFANA_PORT).
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required — never deploy with the default 'admin'}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13001}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  finmind_postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
