version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    ignore:
      # numpy >= 2.5 and scipy >= 1.18 were held back for needing Python
      # >= 3.12 against a 3.11 runtime. The runtime is 3.12 now, so both
      # entries are gone — that was the whole point of the upgrade.
      #
      # bcrypt is deliberately held on the 3.2 line — requirements.txt
      # says why, right above the pin: passlib 1.7.4 reads
      # `bcrypt.__about__.__version__`, removed in bcrypt 4.0, so the
      # library fails at import. Dependabot proposed 5.0.0 anyway and CI
      # confirmed the documented breakage, twice. Honour the existing
      # decision rather than re-litigate it every week; lift when
      # passlib 1.8 ships.
      - dependency-name: bcrypt
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ["*"]
    ignore:
      # typescript-eslint 8.x pins peer typescript ">=4.8.4 <6.1.0", so a
      # TS 7 bump makes `npm ci` fail ERESOLVE and takes the whole grouped
      # PR down with it. Drop this once typescript-eslint supports TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
