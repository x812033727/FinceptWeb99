replicaCount:
  backend: 2
  frontend: 2

image:
  # ⚠️ Nothing publishes these. CI used to try — the workflow failed on
  # every push to main for months with `permission_denied: write_package`
  # and the packages were never created, so a Helm deploy would have
  # pulled a 404 regardless. The workflow is gone; build and push the
  # images yourself before deploying this chart:
  #
  #   docker build -t ghcr.io/<owner>/finceptweb-backend:<tag> ./backend
  #   docker push  ghcr.io/<owner>/finceptweb-backend:<tag>
  #
  # (The compose deployment doesn't use these at all — it builds locally.)
  #
  # Tags are intentionally empty so Helm fails fast if a deploy doesn't pin
  # a specific version (e.g. `--set image.backend.tag=v0.2.0` or use a
  # @sha256 digest). The `latest` floating tag is unsafe in production
  # because rollback then becomes impossible.
  backend:
    repository: ghcr.io/x812033727/finceptweb-backend
    tag: ""
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/x812033727/finceptweb-frontend
    tag: ""
    pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  backend:
    type: ClusterIP
    port: 8000
  frontend:
    type: ClusterIP
    port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  host: fincept.example.com
  tls:
    enabled: true
    secretName: fincept-tls

resources:
  backend:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

autoscaling:
  backend:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  frontend:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

postgresql:
  host: postgres
  port: 5432
  database: fincept
  user: fincept
  # existingSecret: fincept-pg-secret
  # passwordKey: password

redis:
  host: redis
  port: 6379
  # existingSecret: fincept-redis-secret
  # passwordKey: password

env:
  backend:
    DEBUG: "false"
    POLYGON_API_KEY: ""
    FRED_API_KEY: ""
    FINNHUB_API_KEY: ""
    FINMIND_TOKEN: ""
    OPENAI_API_KEY: ""
    ANTHROPIC_API_KEY: ""
    GEMINI_API_KEY: ""
    OLLAMA_BASE_URL: "http://ollama:11434"
    # OpenAI-compatible providers (share build_openai_compat_toolset).
    # Empty key disables the provider; the AI router falls back to
    # whichever providers are configured.
    MINIMAX_API_KEY: ""
    GROQ_API_KEY: ""
    DEEPSEEK_API_KEY: ""
    OPENROUTER_API_KEY: ""
    # Claude Agent (tool-use via claude-agent-sdk). The SDK is optional;
    # CLAUDE_AGENT_ENABLED=false hard-disables even if installed.
    CLAUDE_AGENT_ENABLED: "true"
    JWT_SECRET_KEY: ""
    CORS_ORIGINS: "https://fincept.example.com"
    # Existing active account published anonymously at /daily. Empty disables.
    PUBLIC_DAILY_RESULTS_OWNER_EMAIL: ""
    # FinMind clone subsystem.
    # USE_MAIN_DB=true (default) shares the main Postgres via a
    # `finmind` schema — avoids running a second Postgres pod. Set
    # to "false" explicitly if you want to run the separate
    # `postgres_finmind` container.
    FINMIND_USE_MAIN_DB: "true"
    # Lifespan auto-runs alembic + seed on backend boot. Set "false" for
    # multi-pod deploys where only one pod should run migrations.
    FINMIND_AUTO_INIT: "true"
    # Only used when FINMIND_USE_MAIN_DB=false. Empty = the in-code
    # default; set to your in-cluster postgres_finmind URL when applicable.
    FINMIND_DATABASE_URL: ""
    # SMTP — daily auto-run discussion email report. Leave HOST + FROM
    # empty to disable the feature (the cron skips with a log warning).
    # See `services.email_service.is_configured`.
    SMTP_HOST: ""
    SMTP_PORT: "587"
    SMTP_USER: ""
    SMTP_PASSWORD: ""
    SMTP_FROM: ""
    SMTP_USE_TLS: "true"
    SMTP_USE_SSL: "false"
    SMTP_TIMEOUT_SECONDS: "20"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

livenessProbe:
  backend:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 15
    failureThreshold: 3
  frontend:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 15

readinessProbe:
  backend:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 10
  frontend:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 10

# PodDisruptionBudget keeps at least one pod available during voluntary
# disruptions (node drains, cluster upgrades, HPA scale-downs).
podDisruptionBudget:
  enabled: true
  backend:
    minAvailable: 1
  frontend:
    minAvailable: 1
